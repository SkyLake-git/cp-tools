[package]
name = "cp-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wl-clipboard-rs", "wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
fancy-regex = "0.20.0"
glob = "0.3.4"
indicatif = "0.18.6"
keyring = { version = "4.2.0" }
owo-colors = "4.4.0"
pathdiff = "0.2.3"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "cookies", "form"] }
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
terminal_size = "0.4.4"
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
