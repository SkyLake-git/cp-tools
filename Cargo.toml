[package]
name = "cargo-cp-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
keyring = "4.2.0"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", features = ["blocking", "cookies"] }
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
terminal_size = "0.4.4"
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
